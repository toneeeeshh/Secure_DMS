# Free-tier friendly blueprint for demo purposes.
# NOTE: Render's free plan has no persistent disk, so the database and any
# uploaded files reset whenever the app restarts (roughly every 15 minutes
# of inactivity, and on every redeploy). Fine for showing people a live demo;
# not suitable for storing real documents long-term. See README for the
# persistent-storage version of this file if you need data to stick around.
services:
  - type: web
    name: secure-dms
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true   # Render generates and stores a strong random secret for you
